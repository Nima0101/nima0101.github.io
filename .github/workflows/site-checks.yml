name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Optional HTTPS URL for live Pages verification'
        required: false
        type: string
      profile_url:
        description: 'Optional public GitHub profile or README URL'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install verification tools
        working-directory: .github/check
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check responsive rendering and accessibility
        env:
          SITE_URL: ${{ inputs.site_url }}
          PROFILE_URL: ${{ inputs.profile_url }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/site-http.log" 2>&1 &
          site_server_pid=$!
          trap 'kill "$site_server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node .github/check/site.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: site-browser-evidence
          path: site-artifacts/
          retention-days: 7
